<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2060 1030" width="2060" height="1030"><defs><marker id="punta-091e42" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#091e42" /></marker><marker id="punta-0d7a4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0d7a4f" /></marker><marker id="punta-c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" /></marker></defs><rect width="2060" height="1030" fill="#ffffff" /><text x="200" y="0" font-family="Poppins, Helvetica, sans-serif" font-size="20" fill="#091e42"><tspan x="200" dy="20">Journey · Comunicados de cambios y reprogramaciones</tspan></text><text x="200" y="26" font-family="Poppins, Helvetica, sans-serif" font-size="12" fill="#5b6987"><tspan x="200" dy="12">Adipa · Coordinación de Experiencia del Cliente</tspan></text><rect x="200" y="40" width="1780" height="150" rx="8" fill="#fafaff" stroke="#b8c0d9" stroke-width="1" stroke-dasharray="6 5" /><text x="214" y="50" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="214" dy="11">1 · ÁREA ACADÉMICA</tspan></text><rect x="200" y="210" width="1780" height="340" rx="8" fill="#fafaff" stroke="#b8c0d9" stroke-width="1" stroke-dasharray="6 5" /><text x="214" y="220" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="214" dy="11">2 · COORDINACIÓN DE EXPERIENCIA DEL CLIENTE</tspan></text><rect x="200" y="570" width="1780" height="190" rx="8" fill="#fafaff" stroke="#b8c0d9" stroke-width="1" stroke-dasharray="6 5" /><text x="214" y="580" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="214" dy="11">3 · VALIDACIÓN</tspan></text><rect x="200" y="780" width="1780" height="150" rx="8" fill="#fafaff" stroke="#b8c0d9" stroke-width="1" stroke-dasharray="6 5" /><text x="214" y="790" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="214" dy="11">4 · ESTUDIANTES</tspan></text><rect x="220" y="250" width="265" height="185" rx="8" fill="#ffffff" stroke="#704efd" stroke-width="2" /><text x="234" y="262" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#704efd"><tspan x="234" dy="11">PASO 1</tspan></text><text x="234" y="280" font-family="Poppins, Helvetica, sans-serif" font-size="16" fill="#091e42"><tspan x="234" dy="16">Solicitud</tspan></text><text x="234" y="308" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#42506e"><tspan x="234" dy="11">Entra: tipo de programa, tipo de</tspan><tspan x="234" dy="13.75">comunicado, países, clases con sus</tspan><tspan x="234" dy="13.75">fechas, horario por país, datos de Zoom,</tspan><tspan x="234" dy="13.75">motivo interno.</tspan></text><text x="234" y="380" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="234" dy="11">Sale: solicitud registrada y validador</tspan><tspan x="234" dy="13.75">determinado.</tspan></text><rect x="510" y="250" width="265" height="185" rx="8" fill="#ffffff" stroke="#704efd" stroke-width="2" /><text x="524" y="262" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#704efd"><tspan x="524" dy="11">PASO 2</tspan></text><text x="524" y="280" font-family="Poppins, Helvetica, sans-serif" font-size="16" fill="#091e42"><tspan x="524" dy="16">Redacción</tspan></text><text x="524" y="308" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#42506e"><tspan x="524" dy="11">Entra: datos de la solicitud, comunicado</tspan><tspan x="524" dy="13.75">de referencia, plantillas propias,</tspan><tspan x="524" dy="13.75">observaciones previas.</tspan></text><text x="524" y="380" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="524" dy="11">Sale: asunto y cuerpo del comunicado.</tspan></text><polyline points="488,342.5 507,342.5" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><rect x="800" y="250" width="265" height="185" rx="8" fill="#ffffff" stroke="#704efd" stroke-width="2" /><text x="814" y="262" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#704efd"><tspan x="814" dy="11">PASO 3</tspan></text><text x="814" y="280" font-family="Poppins, Helvetica, sans-serif" font-size="16" fill="#091e42"><tspan x="814" dy="16">Validación</tspan></text><text x="814" y="308" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#42506e"><tspan x="814" dy="11">Entra: asunto y cuerpo, marca de caso</tspan><tspan x="814" dy="13.75">sensible.</tspan></text><text x="814" y="380" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="814" dy="11">Sale: link de revisión y estado en</tspan><tspan x="814" dy="13.75">revisión.</tspan></text><polyline points="778,342.5 797,342.5" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><rect x="1090" y="250" width="265" height="185" rx="8" fill="#ffffff" stroke="#704efd" stroke-width="2" /><text x="1104" y="262" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#704efd"><tspan x="1104" dy="11">PASO 4</tspan></text><text x="1104" y="280" font-family="Poppins, Helvetica, sans-serif" font-size="16" fill="#091e42"><tspan x="1104" dy="16">Bases</tspan></text><text x="1104" y="308" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#42506e"><tspan x="1104" dy="11">Entra: archivos .xlsx o .csv de</tspan><tspan x="1104" dy="13.75">participantes y los países a los que</tspan><tspan x="1104" dy="13.75">aplica cada uno.</tspan></text><text x="1104" y="380" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="1104" dy="11">Sale: lista consolidada, total por país</tspan><tspan x="1104" dy="13.75">y cantidad excluida.</tspan></text><polyline points="1068,342.5 1087,342.5" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><rect x="1380" y="250" width="265" height="185" rx="8" fill="#ffffff" stroke="#704efd" stroke-width="2" /><text x="1394" y="262" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#704efd"><tspan x="1394" dy="11">PASO 5</tspan></text><text x="1394" y="280" font-family="Poppins, Helvetica, sans-serif" font-size="16" fill="#091e42"><tspan x="1394" dy="16">Destinatarios</tspan></text><text x="1394" y="308" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#42506e"><tspan x="1394" dy="11">Entra: lista consolidada y exclusiones</tspan><tspan x="1394" dy="13.75">hechas a mano.</tspan></text><text x="1394" y="380" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="1394" dy="11">Sale: incluidos y excluidos, cada uno</tspan><tspan x="1394" dy="13.75">con su motivo.</tspan></text><polyline points="1358,342.5 1377,342.5" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><rect x="1670" y="250" width="265" height="185" rx="8" fill="#ffffff" stroke="#704efd" stroke-width="2" /><text x="1684" y="262" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#704efd"><tspan x="1684" dy="11">PASO 6</tspan></text><text x="1684" y="280" font-family="Poppins, Helvetica, sans-serif" font-size="16" fill="#091e42"><tspan x="1684" dy="16">Envío</tspan></text><text x="1684" y="308" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#42506e"><tspan x="1684" dy="11">Entra: comunicado aprobado y lista</tspan><tspan x="1684" dy="13.75">final.</tspan></text><text x="1684" y="380" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="1684" dy="11">Sale: destinatarios.csv para Yamm,</tspan><tspan x="1684" dy="13.75">asunto y cuerpo, registro del envío.</tspan></text><polyline points="1648,342.5 1667,342.5" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><ellipse cx="275" cy="109" rx="55" ry="31" fill="#dfd5ff" stroke="#704efd" stroke-width="1" /><text x="244" y="99" font-family="Poppins, Helvetica, sans-serif" font-size="12" fill="#704efd"><tspan x="244" dy="12">INICIO</tspan></text><rect x="370" y="56" width="340" height="48" rx="8" fill="#f3f4ff" stroke="#091e42" stroke-width="1" /><text x="384" y="66" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="384" dy="11">Slack: el área académica comenta el cambio y por</tspan><tspan x="384" dy="13.75">qué.</tspan></text><rect x="370" y="114" width="340" height="48" rx="8" fill="#f3f4ff" stroke="#091e42" stroke-width="1" /><text x="384" y="124" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="384" dy="11">Tablero de Monday «Reprogramaciones y cambios».</tspan></text><text x="722" y="96" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="722" dy="11">o ambas</tspan></text><polyline points="333,98 367,80" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><polyline points="333,120 367,138" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><polyline points="545,165 360,245" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><text x="570" y="172" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="570" dy="11">Cualquiera de las dos se registra a mano en el</tspan><tspan x="570" dy="13.75">formulario</tspan></text><rect x="800" y="605" width="305" height="118" rx="8" fill="#cbe8ff" stroke="#2cb7ff" stroke-width="2" /><text x="814" y="617" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#0272aa"><tspan x="814" dy="11">VISTA DE REVISIÓN</tspan></text><text x="814" y="636" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="814" dy="11">El validador abre su link, lee el comunicado</tspan><tspan x="814" dy="13.75">completo y elige: aprobar o solicitar cambios</tspan><tspan x="814" dy="13.75">con observaciones.</tspan></text><polyline points="930,438 930,602" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><text x="940" y="470" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="940" dy="11">Link de revisión</tspan></text><polyline points="1109,655 1220,439" fill="none" stroke="#0d7a4f" stroke-width="2" marker-end="url(#punta-0d7a4f)" /><text x="1098" y="560" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#0d7a4f"><tspan x="1098" dy="11">Si aprueba → sigue a Bases</tspan></text><polyline points="796,655 640,439" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#punta-c2410c)" /><text x="500" y="560" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#c2410c"><tspan x="500" dy="11">Si pide cambios → vuelve a Redacción</tspan></text><rect x="1420" y="605" width="330" height="96" rx="8" fill="#fdf1e7" stroke="#c2410c" stroke-width="1" stroke-dasharray="6 5" /><text x="1434" y="617" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#c2410c"><tspan x="1434" dy="11">REGLA QUE BLOQUEA</tspan></text><text x="1434" y="636" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="1434" dy="11">Si no existe una aprobación válida, entonces no se</tspan><tspan x="1434" dy="13.75">avanza a Bases ni se habilita el envío.</tspan></text><rect x="1090" y="452" width="265" height="86" rx="8" fill="#fdf1e7" stroke="#c2410c" stroke-width="1" stroke-dasharray="6 5" /><text x="1102" y="461" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#c2410c"><tspan x="1102" dy="11">SI EL ARCHIVO NO SIRVE</tspan></text><text x="1102" y="479" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="1102" dy="11">Si el archivo no trae columna de correo,</tspan><tspan x="1102" dy="13.75">entonces no se carga y se explica qué</tspan><tspan x="1102" dy="13.75">encabezado falta.</tspan></text><polyline points="1220,437 1220,449" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#punta-c2410c)" /><rect x="1380" y="452" width="265" height="86" rx="8" fill="#fdf1e7" stroke="#c2410c" stroke-width="1" stroke-dasharray="6 5" /><text x="1392" y="461" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#c2410c"><tspan x="1392" dy="11">SI EL CONTACTO NO CALIFICA</tspan></text><text x="1392" y="479" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="1392" dy="11">Si el rol no es estudiante, el correo es</tspan><tspan x="1392" dy="13.75">inválido o está repetido, entonces queda</tspan><tspan x="1392" dy="13.75">fuera con su motivo a la vista.</tspan></text><polyline points="1510,437 1510,449" fill="none" stroke="#c2410c" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#punta-c2410c)" /><rect x="1670" y="812" width="265" height="86" rx="8" fill="#f3f4ff" stroke="#091e42" stroke-width="1" /><text x="1682" y="822" font-family="Poppins, Helvetica, sans-serif" font-size="13" fill="#091e42"><tspan x="1682" dy="13">Recibe el comunicado</tspan></text><text x="1682" y="845" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#42506e"><tspan x="1682" dy="11">Si responde, su consulta llega a la</tspan><tspan x="1682" dy="13.75">casilla de atención (sac@adipa.cl).</tspan></text><polyline points="1800,438 1800,809" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><text x="1810" y="560" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="1810" dy="11">Envío desde Yamm con el CSV</tspan></text><ellipse cx="2020" cy="856" rx="55" ry="30" fill="#dfd5ff" stroke="#704efd" stroke-width="1" /><text x="1997" y="846" font-family="Poppins, Helvetica, sans-serif" font-size="12" fill="#704efd"><tspan x="1997" dy="12">FIN</tspan></text><polyline points="1939,855 1962,855" fill="none" stroke="#091e42" stroke-width="2" marker-end="url(#punta-091e42)" /><text x="200" y="960" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#6b7796"><tspan x="200" dy="11">CÓMO LEER EL MAPA</tspan></text><rect x="200" y="982" width="26" height="18" rx="8" fill="#ffffff" stroke="#704efd" stroke-width="2" /><text x="236" y="984" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="236" dy="11">Pantalla del asistente</tspan></text><rect x="480" y="982" width="26" height="18" rx="8" fill="#fdf1e7" stroke="#c2410c" stroke-width="1" stroke-dasharray="6 5" /><text x="516" y="984" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="516" dy="11">Camino de error o regla que bloquea</tspan></text><rect x="860" y="982" width="26" height="18" rx="8" fill="#cbe8ff" stroke="#2cb7ff" stroke-width="2" /><text x="896" y="984" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="896" dy="11">Pantalla fuera del asistente</tspan></text><ellipse cx="1203" cy="991" rx="13" ry="10" fill="#dfd5ff" stroke="#704efd" stroke-width="1" /><text x="1226" y="984" font-family="Poppins, Helvetica, sans-serif" font-size="11" fill="#091e42"><tspan x="1226" dy="11">Inicio y fin del journey</tspan></text></svg>